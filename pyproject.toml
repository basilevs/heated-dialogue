[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heated-dialogue"
version = "0.0.2"
dependencies = [
  "pydub",
  "requests",
  "elevenlabs",
  "audioop-lts"
]
requires-python = ">=3.8"
authors = [
  {name = "Gulevich Vasili", email = "basilevs@gmail.com"}
]
description = "Generates an audio of a heated dialogue"
readme = "README.md"
license = "EPL-2.0"
license-files = ["LICEN[CS]E.*"]
keywords = ["ElevenLabs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[tool.hatch.build.targets.wheel]
packages=["heateddialogue"]

[project.urls]
Homepage = "https://github.com/basilevs/heated-dialogue"
Documentation = "https://github.com/basilevs/heated-dialogue"
Repository = "https://github.com/basilevs/heated-dialogue.git"
"Bug Tracker" = "https://github.com/basilevs/heated-dialogue/issues"
Changelog = "https://github.com/basilevs/heated-dialogue/commits/master/"

[project.scripts]
text2dialogue = "heateddialogue.cli:text2dialogue"
